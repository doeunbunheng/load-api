name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Train and bundle the champion model
        run: python scripts/build_bundle.py --source train

      - name: Run tests with MLFLOW_TRACKING_URI unset
        env:
          MLFLOW_TRACKING_URI: ""
        run: python -m pytest

      - name: Upload model bundle
        uses: actions/upload-artifact@v4
        with:
          name: model-bundle
          path: |
            model.joblib
            model_metadata.json
          if-no-files-found: error

  build-and-push:
    name: build-and-push
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download trained bundle
        uses: actions/download-artifact@v4
        with:
          name: model-bundle

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize image tags
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo "- \`$IMAGE_NAME:$GITHUB_SHA\`"
            echo "- \`$IMAGE_NAME:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing repository secret RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Render deploy hook returned HTTP $code"
          case "$code" in
            200|201|202) ;;
            *) echo "::error::Render deploy hook failed with HTTP $code"; exit 1 ;;
          esac
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          payload = {
              "commit_timestamp": os.environ["COMMIT_TIMESTAMP"],
              "deploy_triggered_at": datetime.now(timezone.utc).isoformat(),
          }
          with open("deploy_timing.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload deploy timing
        uses: actions/upload-artifact@v4
        with:
          name: deploy-timing
          path: deploy_timing.json
          if-no-files-found: error

  verify:
    name: verify
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download deploy timing
        uses: actions/download-artifact@v4
        with:
          name: deploy-timing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install verification dependency
        run: pip install requests==2.34.2

      - name: Wait for the live service to report this commit
        env:
          LIVE_URL: ${{ vars.RENDER_SERVICE_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ -z "$LIVE_URL" ]; then
            echo "::error::Missing repository variable RENDER_SERVICE_URL (for example https://load-api.onrender.com)"
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          base = os.environ["LIVE_URL"].rstrip("/")
          expected = os.environ["EXPECTED_SHA"]
          deadline = time.time() + 15 * 60
          attempts = 0
          health = None
          while time.time() < deadline:
              attempts += 1
              try:
                  with urllib.request.urlopen(f"{base}/health", timeout=30) as response:
                      health = json.load(response)
              except (urllib.error.URLError, TimeoutError, ValueError) as exc:
                  print(f"attempt {attempts}: {type(exc).__name__}: {exc}")
              else:
                  print(f"attempt {attempts}: git_sha={health.get('git_sha')}")
                  if health.get("git_sha") == expected:
                      break
              time.sleep(10)

          if not health or health.get("git_sha") != expected:
              raise SystemExit(
                  f"Timed out waiting for {base}/health to report {expected}; last={health}"
              )

          timing = json.load(open("deploy_timing.json", encoding="utf-8"))
          live_at = datetime.now(timezone.utc)
          commit_at = datetime.fromisoformat(
              timing["commit_timestamp"].replace("Z", "+00:00")
          )
          deploy_at = datetime.fromisoformat(timing["deploy_triggered_at"])
          evidence = {
              "live_url": base,
              "expected_sha": expected,
              "health": health,
              "attempts": attempts,
              "live_verified_at": live_at.isoformat(),
              "seconds_commit_to_live": round((live_at - commit_at).total_seconds(), 1),
              "seconds_deploy_to_live": round((live_at - deploy_at).total_seconds(), 1),
          }
          with open("verify.json", "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, indent=2)
          print(json.dumps(evidence, indent=2))
          PY

      - name: Verify the public health route, API-key gate, and prediction
        env:
          LIVE_URL: ${{ vars.RENDER_SERVICE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then
            python scripts/verify_live.py --url "$LIVE_URL" --json verify-smoke.json
          else
            python scripts/verify_live.py --url "$LIVE_URL" --health-only --json verify-smoke.json
          fi

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-verification
          path: |
            verify.json
            verify-smoke.json
          if-no-files-found: error
